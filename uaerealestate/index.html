    <!-- Web fonts. Engravers Gothic is self-hosted (@font-face in
         src/index.css) and sets every line of the first screen.
         Satoshi (free from Fontshare) is the body face of the lower
         sections and the contact form; nothing visible in the first
         screen uses it.

         • Both Engravers files are preloaded. Otherwise the browser
           only finds them once index.css is parsed AND React has
           rendered text that uses them, so on a real network the hero
           would paint in the fallback face and swap. Each href must be
           exactly the URL the @font-face rule asks for (Vite adds the
           base, the mirror re-bases it), and fonts are always fetched
           in CORS mode, so the preload needs crossorigin even on our
           own origin: without it the file is downloaded twice.
         • The Fontshare stylesheet does not block the first paint: it
           is fetched as media="print" (no render blocking) and switched
           to all once it has loaded; <noscript> keeps the plain link
           for visitors without JS. Its faces are display=swap anyway.
         • Preconnects warm both Fontshare hosts. The stylesheet is a
           plain (no-cors) request, so its preconnect has no
           crossorigin; the Satoshi files themselves come from
           cdn.fontshare.com in CORS mode, so that one does. A
           preconnect whose mode does not match is never used. -->
    <link
      rel="preload"
      href="/uaerealestate/fonts/EngraversGothicBT-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/uaerealestate/fonts/EngraversGothicBT-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
